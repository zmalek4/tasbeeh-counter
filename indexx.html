<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Tasbeeh Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0d131a;
      --card-bg: rgba(22, 31, 44, 0.7);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 32px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    .header {
      text-align: center;
      width: 100%;
    }

    .title-ar {
      font-family: 'Amiri', serif;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 4px;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .phrase-select {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      cursor: pointer;
      text-align: center;
      transition: all 0.3s ease;
    }

    .phrase-select:focus {
      border-color: var(--accent);
    }

    /* Counter Display Ring */
    .counter-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .progress-ring {
      transform: rotate(-90deg);
      position: absolute;
      top: 0;
      left: 0;
    }

    .progress-ring__circle {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 8;
    }

    .progress-ring__progress {
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 628; /* 2 * PI * 100 */
      stroke-dashoffset: 628;
      transition: stroke-dashoffset 0.2s ease-in-out;
      filter: drop-shadow(0 0 6px var(--accent));
    }

    .counter-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .count-number {
      font-size: 4.5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffffff 0%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .goal-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 600;
    }

    /* Controls */
    .btn-main {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-main:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px var(--accent-glow);
    }

    .secondary-actions {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 10px;
      gap: 12px;
    }

    .btn-sub {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease;
    }

    .btn-sub:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    /* Total Stats */
    .stats {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border);
      width: 100%;
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title-ar" id="arDisplay">سُبْحَانَ ٱللَّٰهِ</div>
      <select class="phrase-select" id="phraseSelect" onchange="changePhrase()">
        <option value="سُبْحَانَ ٱللَّٰهِ">SubhanAllah</option>
        <option value="ٱلْحَمْدُ لِلَّٰهِ">Alhamdulillah</option>
        <option value="ٱللَّٰهُ أَكْبَرُ">Allahu Akbar</option>
        <option value="أَسْتَغْفِرُ ٱللَّٰهَ">Astaghfirullah</option>
        <option value="لَا إِلَٰهَ إِلَّا ٱللَّٰهُ">La ilaha illallah</option>
      </select>
    </div>

    <!-- Ring Display -->
    <div class="counter-wrapper">
      <svg class="progress-ring" width="220" height="220">
        <circle class="progress-ring__circle" r="100" cx="110" cy="110"/>
        <circle class="progress-ring__progress" id="progressCircle" r="100" cx="110" cy="110"/>
      </svg>
      <div class="counter-display">
        <span class="count-number" id="countDisplay">0</span>
        <span class="goal-text" id="goalDisplay">Target: 33</span>
      </div>
    </div>

    <!-- Main Tap Button -->
    <button class="btn-main" id="tapBtn" onclick="increment()">COUNT</button>

    <!-- Extra Controls -->
    <div class="secondary-actions">
      <button class="btn-sub" onclick="resetCount()">Reset</button>
      <button class="btn-sub" onclick="setGoalPrompt()">Set Target</button>
    </div>

    <div class="stats">
      Total Session Recitations: <span id="totalDisplay" style="color: var(--accent); font-weight: 600;">0</span>
    </div>
  </div>

  <script>
    let count = 0;
    let target = 33;
    let totalCount = 0;

    const countDisplay = document.getElementById('countDisplay');
    const goalDisplay = document.getElementById('goalDisplay');
    const totalDisplay = document.getElementById('totalDisplay');
    const progressCircle = document.getElementById('progressCircle');
    const arDisplay = document.getElementById('arDisplay');
    const phraseSelect = document.getElementById('phraseSelect');

    const radius = progressCircle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;

    function updateProgress() {
      countDisplay.innerText = count;
      goalDisplay.innerText = `Target: ${target}`;
      totalDisplay.innerText = totalCount;

      // Update ring
      const progressRatio = Math.min(count / target, 1);
      const offset = circumference - (progressRatio * circumference);
      progressCircle.style.strokeDashoffset = offset;
    }

    function increment() {
      count++;
      totalCount++;

      // Trigger haptic vibration on mobile devices if supported
      if (navigator.vibrate) {
        navigator.vibrate(25);
      }

      // Check for goal completion
      if (count === target) {
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        setTimeout(() => {
          alert(`Target of ${target} completed!`);
        }, 100);
      }

      updateProgress();
    }

    function resetCount() {
      count = 0;
      updateProgress();
    }

    function setGoalPrompt() {
      const newGoal = prompt("Enter target number:", target);
      if (newGoal && !isNaN(newGoal) && newGoal > 0) {
        target = parseInt(newGoal);
        resetCount();
      }
    }

    function changePhrase() {
      arDisplay.innerText = phraseSelect.value;
      resetCount();
    }

    // Keyboard support (Spacebar / Enter to increment)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        increment();
        // Visual press effect for button
        const btn = document.getElementById('tapBtn');
        btn.style.transform = 'scale(0.92)';
        setTimeout(() => btn.style.transform = 'scale(1)', 100);
      }
    });

    // Initial setup
    updateProgress();
  </script>
</body>
</html>
